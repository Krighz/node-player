<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#050811" />
    </radialGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="glassBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.25" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer squircle -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGlow)" stroke="url(#glassBorder)" stroke-width="4" />
  
  <!-- Subtle inner caustic glow -->
  <circle cx="256" cy="180" r="140" fill="#38BDF8" opacity="0.12" filter="blur(30px)" />
  
  <!-- Connecting Node Spline Wave -->
  <path d="M 110 320 Q 180 180 256 280 T 402 210" fill="none" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" opacity="0.6" filter="url(#neonGlow)" />
  <path d="M 110 320 Q 180 180 256 280 T 402 210" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
  
  <!-- Nodes -->
  <!-- Node 1 -->
  <circle cx="110" cy="320" r="28" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="4" filter="url(#neonGlow)" />
  <circle cx="110" cy="320" r="10" fill="#FFFFFF" />
  
  <!-- Node 2 (Center Peak) -->
  <circle cx="256" cy="280" r="38" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="5" filter="url(#neonGlow)" />
  <circle cx="256" cy="280" r="14" fill="#FFFFFF" />
  
  <!-- Node 3 -->
  <circle cx="402" cy="210" r="28" fill="url(#nodeGrad)" stroke="#FFFFFF" stroke-width="4" filter="url(#neonGlow)" />
  <circle cx="402" cy="210" r="10" fill="#FFFFFF" />
</svg>
