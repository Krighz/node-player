name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Prepare Keystore and Build Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > /tmp/release.keystore
            export KEYSTORE_FILE=/tmp/release.keystore
            ./gradlew assembleRelease --stacktrace
          else
            echo "Notice: KEYSTORE_BASE64 secret is not configured in this repository."
            echo "Building with debug signing fallback..."
            ./gradlew assembleRelease --stacktrace
          fi

      - name: Locate and Prepare Release Artifact
        run: |
          APK_FILE=$(find app-android/build/outputs/apk/release/ -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            echo "Release APK not found in release folder, searching in debug..."
            ./gradlew assembleDebug --stacktrace
            APK_FILE=$(find app-android/build/outputs/apk/debug/ -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          TAG_NAME="${{ github.ref_name }}"
          DEST_NAME="NodePlayer-${TAG_NAME}.apk"
          cp "$APK_FILE" "$DEST_NAME"
          echo "OUTPUT_APK=$DEST_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" "$OUTPUT_APK" \
            --title "Node Player ${{ github.ref_name }}" \
            --generate-notes
