<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 Not Found — Node Player</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="fonts.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #07090E;
      color: #F8FAFC;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px;
      max-width: 480px;
      backdrop-filter: blur(20px);
    }
    h1 {
      font-size: 72px;
      margin: 0 0 16px 0;
      background: linear-gradient(135deg, #FFF, #38BDF8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      color: #94A3B8;
      font-size: 18px;
      line-height: 1.6;
      margin: 0 0 32px 0;
    }
    .btn {
      display: inline-block;
      padding: 14px 28px;
      background: #38BDF8;
      color: #07090E;
      text-decoration: none;
      font-weight: 600;
      border-radius: 999px;
      transition: transform 0.2s, background 0.2s;
    }
    .btn:hover {
      transform: translateY(-2px);
      background: #7DD3FC;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>404</h1>
    <p>The audio path you requested does not exist or has been shifted in the signal chain.</p>
    <a href="./" class="btn">Return to Node Player</a>
  </div>
</body>
</html>
